version: 1.0.0
homepage: https://github.com/raidmrani/liquid_glass_nav_bar
repository: https://github.com/raidmrani/liquid_glass_nav_bar
issue_tracker: https://github.com/raidmrani/liquid_glass_nav_bar/issues

environment:
  sdk: ^3.10.4
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - navigation
  - bottom-bar
  - glassmorphism
  - liquid-animation
  - ui

flutter:
  uses-material-design: true
